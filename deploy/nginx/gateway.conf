map $http_x_forwarded_proto $racota_scheme {
    default http;
    https https;
}
map $http_x_real_ip $racota_client_ip {
    "" $remote_addr;
    default $http_x_real_ip;
}
map $host $racota_robots {
    default "";
    app.racotagames.com "noindex, nofollow";
}
server {
    listen 8080;
    server_name racotagames.com app.racotagames.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $racota_frontend http://racota-frontend:3000;
    set $racota_backend http://racota-backend:8000;
    client_max_body_size 16m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag $racota_robots always;
    location = /robots.txt {
        default_type text/plain;
        if ($host = app.racotagames.com) { return 200 "User-agent: *\nDisallow: /\n"; }
        proxy_pass $racota_frontend;
        include /etc/nginx/racota-proxy-headers.conf;
    }
    location = /healthz {
        access_log off;
        proxy_pass $racota_backend/healthz/;
        include /etc/nginx/racota-proxy-headers.conf;
    }
    location /static/ {
        alias /srv/static/;
        expires 1d;
        access_log off;
    }
    location /media/ {
        alias /srv/media/;
        expires 1h;
        access_log off;
    }
    location /media-proxy/ {
        alias /srv/media/;
        expires 1h;
        access_log off;
    }
    location /api/backend/ {
        rewrite ^/api/backend/(.*)$ /api/$1 break;
        proxy_pass $racota_backend;
        include /etc/nginx/racota-proxy-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /api/ {
        proxy_pass $racota_backend;
        include /etc/nginx/racota-proxy-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /admin {
        proxy_pass $racota_backend;
        include /etc/nginx/racota-proxy-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        if ($host = app.racotagames.com) { return 404; }
        proxy_pass $racota_frontend;
        include /etc/nginx/racota-proxy-headers.conf;
    }
}
