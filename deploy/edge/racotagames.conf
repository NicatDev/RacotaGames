# Add to artexperts-nginx-1; do not replace its existing nginx.conf.
server {
    listen 80;
    server_name racotagames.com app.racotagames.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name racotagames.com app.racotagames.com;
    ssl_certificate /etc/letsencrypt/live/racotagames.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/racotagames.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/racota-cloudflare-realip.conf;
    client_max_body_size 16m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $racota_upstream http://racota-gateway:8080;
    location / {
        proxy_pass $racota_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Use the existing edge's normalized remote_addr; never raw caller XFF.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_buffering off;
        proxy_redirect off;
    }
}
