name: racotagames

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: racota
      POSTGRES_USER: racota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.production first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U racota -d racota"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    command:
      [
        redis-server,
        --save,
        "",
        --appendonly,
        "no",
        --maxmemory,
        48mb,
        --maxmemory-policy,
        volatile-lru,
      ]
    restart: unless-stopped
    networks: [private]
    mem_limit: 96m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  backend:
    image: racotagames-backend:${IMAGE_TAG:-local}
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate .env.production first}
      DJANGO_ALLOWED_HOSTS: app.racotagames.com,racotagames.com,backend,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://racotagames.com,https://app.racotagames.com
      DJANGO_SSL_REDIRECT: "false"
      PUBLIC_MEDIA_ORIGIN: https://app.racotagames.com
      POSTGRES_HOST: db
      POSTGRES_DB: racota
      POSTGRES_USER: racota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.production first}
      CACHE_URL: redis://redis:6379/1
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: "2"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    networks: [private]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 384m
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4).read()",
        ]
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 5
    logging: *logging

  frontend:
    image: racotagames-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://racotagames.com
        NEXT_PUBLIC_BACKEND_URL: https://app.racotagames.com
        API_ORIGIN: http://backend:8000
        MEDIA_ORIGIN: http://racota-gateway:8080
    restart: unless-stopped
    init: true
    environment:
      API_ORIGIN: http://backend:8000
      MEDIA_ORIGIN: http://racota-gateway:8080
      NEXT_PUBLIC_SITE_URL: https://racotagames.com
      NEXT_PUBLIC_BACKEND_URL: https://app.racotagames.com
      NODE_OPTIONS: --max-old-space-size=320
    networks: [private]
    depends_on:
      backend: { condition: service_healthy }
    mem_limit: 512m
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  racota-gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy-headers.conf:/etc/nginx/racota-proxy-headers.conf:ro
      - media:/srv/media:ro
      - staticfiles:/srv/static:ro
    networks:
      private:
      edge:
        aliases: [racota-gateway]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    mem_limit: 64m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  private:
    internal: true
  edge:
    external: true
    name: ${PROXY_NETWORK:-artexperts_default}

volumes:
  postgres_data:
  media:
  staticfiles:
